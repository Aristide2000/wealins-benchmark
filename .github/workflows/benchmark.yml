name: Wealins LLM Benchmark

on:
  schedule:
    # Tous les lundis à 6h00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:  # permet de lancer manuellement depuis GitHub

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la décision + benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_ADRESSE: ${{ secrets.GMAIL_ADRESSE }}
          GMAIL_MOT_DE_PASSE_APP: ${{ secrets.GMAIL_MOT_DE_PASSE_APP }}
          EMAIL_DESTINATAIRE: ${{ secrets.EMAIL_DESTINATAIRE }}
        run: python -c "from run import run_avec_decision; run_avec_decision()"

      - name: Commit des résultats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "chore: resultats benchmark automatique [skip ci]"
          git push origin dev